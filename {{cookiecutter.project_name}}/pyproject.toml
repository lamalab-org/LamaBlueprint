[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{cookiecutter.project_name}}"
version = "0.0.1"
description = "{{cookiecutter.project_description}}"
authors = [{ name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }]
dependencies = [
    "lama-aesthetics @ git+https://github.com/lamalab-org/lama-aesthetics.git@main",
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "{{cookiecutter.open_source_license}}" }

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.2",{% if cookiecutter.deptry == 'y' %}
    "deptry>=0.22.0",{% endif %}
    "mypy>=0.991",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",{% if cookiecutter.mkdocs == 'y' %}
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.19.0",{% endif %}
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = [{% if cookiecutter.layout == "src" %}"src/{{cookiecutter.project_slug}}"{% else %}"{{cookiecutter.project_slug}}"{% endif %}]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = [{% if cookiecutter.layout == "src" %}"src"{% else %}"{{cookiecutter.project_slug}}"{% endif %}]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT",  # flake8-2020
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T10",  # flake8-debugger
    "SIM",  # flake8-simplify
    "I",    # isort
    "C90",  # mccabe
    "E", "W",  # pycodestyle
    "F",    # pyflakes
    "PGH",  # pygrep-hooks
    "UP",   # pyupgrade
    "RUF",  # ruff
    "TRY",  # tryceratops
]
ignore = [
    "E501",  # LineTooLong
    "E731",  # DoNotAssignLambda
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]{% if cookiecutter.deptry == 'y' %}

[tool.deptry]{% endif %}
